# What all workspaces together may take from the cluster. gVisor's per-pod
# overhead (the RuntimeClass, vendored) counts against it too. A template
# that asks for a Service or a bigger disk than is left is refused here,
# whatever its Terraform says.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: workspaces
  namespace: coder-workspaces
spec:
  hard:
    pods: "10"
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    persistentvolumeclaims: "10"
    requests.storage: 20Gi
    services: "0"
    services.loadbalancers: "0"
    services.nodeports: "0"
