# corp: a stand-in for another team's service, the kind of thing a fooled
# agent in a workspace would reach for. It answers HTTP on 8080 to anyone the
# network lets through; the e2e asks it from inside a workspace (blocked) and
# from a pod outside the boundary (answered).
apiVersion: v1
kind: ConfigMap
metadata:
  name: internal
  namespace: corp
data:
  index.html: |
    corp internal service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: internal
  namespace: corp
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: internal}
  template:
    metadata:
      labels: {app.kubernetes.io/name: internal}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: httpd
          image: docker.io/library/busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command: [httpd, -f, -p, "8080", -h, /www]
          ports:
            - {name: http, containerPort: 8080, protocol: TCP}
          readinessProbe:
            tcpSocket: {port: 8080}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: www, mountPath: /www, readOnly: true}
      volumes:
        - name: www
          configMap: {name: internal}
---
apiVersion: v1
kind: Service
metadata:
  name: internal
  namespace: corp
spec:
  selector: {app.kubernetes.io/name: internal}
  ports:
    - {name: http, port: 8080, targetPort: 8080, protocol: TCP}
