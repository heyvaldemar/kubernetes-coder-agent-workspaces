# Coder's database: the official PostgreSQL image, pinned by digest, as one
# StatefulSet. Coder needs PostgreSQL 13 or later
# (docs/install/plan/architecture.md in coder/coder); its own compose.yaml
# uses postgres:17.
#
# The password is generated by scripts/install-coder.sh and handed to kubectl
# on stdin; it exists only as the Secret coder-db in this namespace, which
# this StatefulSet and the Coder server read and nothing else does.
#
# Runs as the image's postgres user (uid 70 in the Alpine variant), with a
# read-only root: the data lives on the claim, the socket and scratch files
# on two emptyDirs.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: coder
spec:
  selector: {app.kubernetes.io/name: postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: 5432, protocol: TCP}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: coder
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: docker.io/library/postgres:17.11-alpine3.24@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
          env:
            - {name: POSTGRES_USER, value: coder}
            - {name: POSTGRES_DB, value: coder}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: coder-db, key: password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - {name: postgres, containerPort: 5432, protocol: TCP}
          readinessProbe:
            exec: {command: [pg_isready, -U, coder, -d, coder, -h, 127.0.0.1]}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
