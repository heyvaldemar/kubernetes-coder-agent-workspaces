# model: where a model provider would be. Coder Agents' loop runs in the
# Coder server and asks this endpoint what to do; it answers from a fixed
# script with tool calls a fooled agent would make (model.py). Only the Coder
# server reaches it: a workspace holds no model key and has no route to a
# model, which is the property Coder's docs describe and the e2e checks.
#
# Pod Security restricted, read-only, by digest, with limits; the same image
# the sandbox's e2e uses for Python.
apiVersion: v1
kind: Namespace
metadata:
  name: model
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model
  namespace: model
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: model}
  template:
    metadata:
      labels: {app.kubernetes.io/name: model}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: model
          image: docker.io/library/python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
          command: [python3, /model/model.py]
          env:
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: PYTHONUNBUFFERED, value: "1"}
          ports:
            - {name: http, containerPort: 8080, protocol: TCP}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: model, mountPath: /model, readOnly: true}
      volumes:
        - name: model
          configMap: {name: model}
---
apiVersion: v1
kind: Service
metadata:
  name: model
  namespace: model
spec:
  selector: {app.kubernetes.io/name: model}
  ports:
    - {name: http, port: 8080, targetPort: 8080, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: model
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: from-the-coder-server
  namespace: model
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: model}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: coder
          podSelector:
            matchLabels:
              app.kubernetes.io/name: coder
      ports:
        - {protocol: TCP, port: 8080}
