# The e2e's external authentication, on top of helm/values.yaml and
# helm/values-github.yaml: the placeholder GitHub provider, and a second
# provider, e2e-oauth, that the owner really links. Its authorize, token and
# userinfo endpoints are the stand-in in manifests/model/model.py: the
# browser's half (authorize, and the redirect back) goes through the runner's
# port-forwards on 127.0.0.1, the server's half (token, userinfo) stays in the
# cluster. scripts/install-coder.sh adds this file with CODER_GITHUB=placeholder,
# which is the e2e's mode only. Helm replaces lists, so the whole env is here
# (scripts/validate.sh checks it carries every setting of the GitHub file).
coder:
  env:
    - name: CODER_ACCESS_URL
      value: http://coder.coder.svc.cluster.local
    - name: CODER_PG_CONNECTION_URL
      valueFrom:
        secretKeyRef: {name: coder-db, key: url}
    - {name: CODER_TELEMETRY_ENABLE, value: "false"}
    - {name: CODER_UPDATE_CHECK, value: "false"}
    - {name: CODER_DERP_SERVER_STUN_ADDRESSES, value: disable}
    - {name: CODER_BLOCK_DIRECT, value: "true"}
    - {name: CHECKPOINT_DISABLE, value: "1"}
    - {name: CODER_CACHE_DIRECTORY, value: /tmp/coder-cache}
    - {name: TF_CLI_CONFIG_FILE, value: /mirror/terraform.rc}
    - {name: CODER_EXTERNAL_AUTH_0_ID, value: github}
    - {name: CODER_EXTERNAL_AUTH_0_TYPE, value: github}
    - name: CODER_EXTERNAL_AUTH_0_CLIENT_ID
      valueFrom:
        secretKeyRef: {name: coder-github, key: client-id}
    - name: CODER_EXTERNAL_AUTH_0_CLIENT_SECRET
      valueFrom:
        secretKeyRef: {name: coder-github, key: client-secret}
    # Where GitHub sends the browser back. Coder builds it from the access URL
    # unless this is set, and the access URL here is the in-cluster name a
    # browser cannot reach; on a laptop it is the port-forward's address. An
    # optional key: unset, the variable is not set at all.
    - name: CODER_EXTERNAL_AUTH_0_REDIRECT_URL
      valueFrom:
        secretKeyRef: {name: coder-github, key: redirect-url, optional: true}
    - {name: CODER_EXTERNAL_AUTH_1_ID, value: e2e-oauth}
    - {name: CODER_EXTERNAL_AUTH_1_TYPE, value: e2e-oauth2}
    - {name: CODER_EXTERNAL_AUTH_1_DISPLAY_NAME, value: "Stand-in OAuth2 provider (e2e)"}
    - {name: CODER_EXTERNAL_AUTH_1_AUTH_URL, value: "http://127.0.0.1:7081/oauth/authorize"}
    - {name: CODER_EXTERNAL_AUTH_1_TOKEN_URL, value: "http://model.model.svc.cluster.local:8080/oauth/token"}
    - {name: CODER_EXTERNAL_AUTH_1_VALIDATE_URL, value: "http://model.model.svc.cluster.local:8080/oauth/userinfo"}
    - {name: CODER_EXTERNAL_AUTH_1_REDIRECT_URL, value: "http://127.0.0.1:7080"}
    - {name: CODER_EXTERNAL_AUTH_1_CLIENT_ID, value: e2e}
    - name: CODER_EXTERNAL_AUTH_1_CLIENT_SECRET
      valueFrom:
        secretKeyRef: {name: coder-e2e-oauth, key: client-secret}
