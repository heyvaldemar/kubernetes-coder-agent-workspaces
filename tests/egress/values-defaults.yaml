# The measurement's other half: Coder's defaults for everything this
# repository turns off (helm/values.yaml), so the table "What the control
# plane dials" can say what each flag removes. Only what the server needs to
# run here stays: where workspaces reach it, its database, and a cache on the
# writable emptyDir. tests/egress/run.sh installs it with the server's way to
# the internet closed, so a default that dials out is seen asking for the name
# and sends nothing.
coder:
  env:
    - name: CODER_ACCESS_URL
      value: http://coder.coder.svc.cluster.local
    - name: CODER_PG_CONNECTION_URL
      valueFrom:
        secretKeyRef: {name: coder-db, key: url}
    - {name: CODER_CACHE_DIRECTORY, value: /tmp/coder-cache}
