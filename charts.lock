# The Helm chart scripts/install-coder.sh installs, pinned by version and the
# sha256 of its archive. The hash is the one helm.coder.com/v2/index.yaml
# publishes as the chart's digest, checked against the downloaded archive on
# 2026-11-22. A chart installed by name from a repository is whatever the
# index says that day; this one is the archive below or nothing.
#
# v2.38.10 is GitHub's latest release, on the 2.38 line Coder's release notes
# name stable since 2026-11-16 (v2.38.8); v2.38.10 changes only Coder's release
# workflow. v2.39.4 is mainline. docs/decisions/0001-coder-community-on-kubernetes.md
# says why stable.
#
# name   version  repository                 sha256                                                            archive
coder    2.38.10  https://helm.coder.com/v2  cb761b2f31286e6556ab63c7e1a0cd9786b8d41692aeee1d7ccd759e76e58107  https://helm.coder.com/v2/coder_helm_2.38.10.tgz
